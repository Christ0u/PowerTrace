<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data View - PowerTrace</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/data-view-style.css">
</head>


<body>

<main class="container">


    <!-- HEADER -->

    <header class="header">

        <h1>Data View</h1>

        <p>
            Measurement data visualization
        </p>

    </header>




    <!-- FILE LIST -->

    <section class="card" id="file-list-section">


        <h2>
            Available Recordings
        </h2>

        <div id="file-list-container">
            <p class="loading-text">
                Loading files...
            </p>
        </div>

    </section>




    <!-- FILE DETAIL -->

    <section class="card hidden" id="file-detail-section">


        <h2>
            File Details
        </h2>

        <!-- FILE INFO -->
        <div class="file-info">
            <div class="file-info-header">
                <span class="file-info-icon">📄</span>
                <div class="file-info-content">
                    <h3 id="detail-filename" class="file-info-name"></h3>
                    <p id="detail-stats" class="file-info-stats"></p>
                </div>
                <div class="file-info-actions">
                    <button id="delete-file-button" class="button delete" type="button">
                        🗑️ Delete
                    </button>
                    <button id="close-detail-button" class="button close" type="button">
                        ✕ Close
                    </button>
                </div>
            </div>
        </div>

        <!-- DATA TABLE -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Timestamp (ms)</th>
                        <th>Bus Voltage (V)</th>
                        <th>Current (A)</th>
                        <th>Power (W)</th>
                        <th>Energy (Wh)</th>
                        <th>Charge (mAh)</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <!-- Data rows will be inserted here -->
                </tbody>
            </table>
        </div>

    </section>



    <!-- NAVIGATION -->

    <section class="card actions">


        <h2>
            Navigation
        </h2>

        <div class="button-group">

            <a href="/" class="button back">
                <- Back to Acquisition
            </a>

        </div>

    </section>



</main>




<script src="/data-view-script.js"></script>


</body>

</html>
